<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Azurite Art Catalog</title>
<style>
:root {
  --bg: #0d131c; --panel: #151e2a; --panel-2: #1c2836; --line: #26354a;
  --text: #e3eaf2; --muted: #8fa3b8; --accent: #6fb7ff;
  --production: #4fc28a; --accepted: #3cc0c0; --current: #6fb7ff; --study: #9aa8b8;
  --pending: #f0b44c; --rejected: #ef6b6b; --legacy: #6d7c8d;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 76px; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { position: sticky; top: 0; z-index: 10; background: rgba(13,19,28,.94);
  backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);
  display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; padding: 12px 20px; }
header h1 { font-size: 17px; margin: 0; letter-spacing: .04em; white-space: nowrap; }
header .count { color: var(--muted); font-size: 13px; }
#search { flex: 1 1 200px; max-width: 320px; background: var(--panel); border: 1px solid var(--line);
  color: var(--text); border-radius: 6px; padding: 7px 10px; font: inherit; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--panel); color: var(--muted);
  border-radius: 999px; padding: 3px 10px; font: inherit; font-size: 12px; cursor: pointer; }
.chip[aria-pressed="true"] { color: var(--text); border-color: var(--c, var(--accent)); }
.chip::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%;
  background: var(--c, var(--accent)); margin-right: 6px; vertical-align: 1px; }
.layout { display: grid; grid-template-columns: 240px 1fr; }
nav { position: sticky; top: 61px; align-self: start; max-height: calc(100vh - 61px); overflow: auto;
  padding: 16px 12px 40px 20px; border-right: 1px solid var(--line); font-size: 13px; }
nav h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 16px 0 6px; }
nav a { display: block; color: var(--text); text-decoration: none; padding: 2px 6px; border-radius: 4px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: .85; }
nav a:hover { background: var(--panel-2); opacity: 1; }
main { padding: 8px 24px 80px; min-width: 0; }
.group > h2 { font-size: 22px; margin: 34px 0 4px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.coll { margin: 22px 0 30px; }
.coll-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.coll-head h3 { margin: 0; font-size: 17px; }
.badge { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; padding: 1px 8px;
  border-radius: 999px; border: 1px solid var(--c); color: var(--c); }
.coll-head .n { color: var(--muted); font-size: 13px; }
.coll p { color: var(--muted); margin: 4px 0 10px; max-width: 80ch; font-size: 14px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
.grid button { padding: 0; border: 1px solid var(--line); border-radius: 6px; background: var(--panel);
  cursor: zoom-in; overflow: hidden; aspect-ratio: 4/3; display: block; width: 100%; }
.grid button:hover, .grid button:focus-visible { border-color: var(--accent); outline: none; }
.grid img { width: 100%; height: 100%; object-fit: contain; display: block; }
.more { margin-top: 8px; background: none; border: 1px solid var(--line); color: var(--accent);
  border-radius: 6px; padding: 5px 12px; font: inherit; font-size: 13px; cursor: pointer; }
.hidden { display: none !important; }
#empty { color: var(--muted); padding: 40px 0; }

#lb { position: fixed; inset: 0; z-index: 20; background: #06090e;
  display: grid; grid-template-rows: auto 1fr auto; }
#lb[hidden] { display: none; }
#lb .top, #lb .bottom { display: flex; align-items: center; gap: 12px; padding: 10px 16px; }
#lb .top { justify-content: space-between; }
#lb .where { font-size: 14px; color: var(--muted); min-width: 0; }
#lb .where b { color: var(--text); font-weight: 600; }
#lb .stage { position: relative; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 0 64px; }
#lb .stage img { max-width: 100%; max-height: 100%; object-fit: contain; image-rendering: auto; }
#lb .stage.actual { overflow: auto; display: block; padding: 0 16px; }
#lb .stage.actual img { max-width: none; max-height: none; }
#lb .nav { position: absolute; top: 50%; transform: translateY(-50%); width: 48px; height: 72px;
  border: 1px solid var(--line); background: rgba(21,30,42,.8); color: var(--text); font-size: 26px;
  border-radius: 8px; cursor: pointer; }
#lb .prev { left: 8px; } #lb .next { right: 8px; }
#lb .bottom { justify-content: space-between; font-size: 13px; color: var(--muted); }
#lb .tools { display: flex; gap: 8px; }
#lb button.t, #lb a.t { background: var(--panel); border: 1px solid var(--line); color: var(--text);
  border-radius: 6px; padding: 5px 10px; font: inherit; font-size: 13px; cursor: pointer; text-decoration: none; white-space: nowrap; }
@media (max-width: 800px) {
  .layout { grid-template-columns: 1fr; }
  nav { display: none; }
  main { padding: 4px 16px 60px; }
  header { padding: 10px 16px; }
  #lb .stage { padding: 0; }
  #lb .nav { width: 40px; height: 56px; opacity: .8; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
}
</style>
</head>

const PREVIEW = 12;
DATA.groups.forEach(g => g.collections.forEach(c => { c.group = g.name; }));
const colls = DATA.groups.flatMap(g => g.collections);
const byId = Object.fromEntries(colls.map(c => [c.id, c]));
const statuses = Object.keys(DATA.status).filter(s => colls.some(c => c.status === s));
const active = new Set(statuses);
const expanded = new Set();
let query = "";
let view = [];   // flat list of {c, i} for lightbox paging, in page order
let pos = -1;

const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
const color = s => `var(--${s})`;

$("chips").innerHTML = statuses.map(s =>
  `<button class="chip" data-s="${s}" aria-pressed="true" style="--c:${color(s)}">${DATA.status[s]}</button>`).join("");
$("chips").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  active.has(b.dataset.s) ? active.delete(b.dataset.s) : active.add(b.dataset.s);
  b.setAttribute("aria-pressed", active.has(b.dataset.s));
  render();
});
$("search").addEventListener("input", e => { query = e.target.value.trim().toLowerCase(); render(); });

function matches(c) {
  if (!active.has(c.status)) return null;
  if (!query) return c.images.map((_, i) => i);
  const head = (c.title + " " + c.desc + " " + c.group).toLowerCase().includes(query);
  const idx = c.images.map((im, i) => i).filter(i => head || c.images[i].caption.toLowerCase().includes(query));
  return idx.length ? idx : null;
}

function render() {
  const main = $("main"), nav = $("nav");
  main.querySelectorAll(".group").forEach(n => n.remove());
  view = []; let shown = 0, nav_html = "";
  for (const g of DATA.groups) {
    let body = "", links = "";
    for (const c of g.collections) {
      const idx = matches(c); if (!idx) continue;
      const lim = expanded.has(c.id) || query ? idx.length : Math.min(PREVIEW, idx.length);
      const start = view.length;
      idx.forEach(i => view.push({c, i}));
      shown += idx.length;
      const tiles = idx.slice(0, lim).map((i, k) =>
        `<button data-v="${start + k}" title="${esc(c.images[i].caption)}"><img loading="lazy" src="${c.images[i].thumb}" alt="${esc(c.images[i].caption)}"></button>`).join("");
      const more = idx.length > lim ? `<button class="more" data-more="${c.id}">Show all ${idx.length}</button>` : "";
      body += `<section class="coll" id="${c.id}">
        <div class="coll-head"><h3>${esc(c.title)}</h3>
        <span class="badge" style="--c:${color(c.status)}">${DATA.status[c.status]}</span>
        <span class="n">${idx.length} image${idx.length === 1 ? "" : "s"}</span></div>
        ${c.desc ? `<p>${esc(c.desc)}</p>` : ""}
        <div class="grid">${tiles}</div>${more}</section>`;
      links += `<a href="#${c.id}">${esc(c.title)}</a>`;
    }
    if (body) {
      main.insertAdjacentHTML("beforeend", `<div class="group"><h2>${esc(g.name)}</h2>${body}</div>`);
      nav_html += `<h3>${esc(g.name)}</h3>${links}`;
    }
  }
  nav.innerHTML = nav_html;
  $("empty").classList.toggle("hidden", shown > 0);
  $("count").textContent = `${shown} images`;
}

$("main").addEventListener("click", e => {
  const m = e.target.closest("[data-more]");
  if (m) { expanded.add(m.dataset.more); render(); document.getElementById(m.dataset.more).scrollIntoView(); return; }
  const t = e.target.closest("[data-v]"); if (t) open(+t.dataset.v);
});

function open(v) {
  pos = (v + view.length) % view.length;
  const {c, i} = view[pos], im = c.images[i];
  $("lb-img").src = im.src; $("lb-img").alt = im.caption;
  $("lb-open").href = im.src;
  $("lb-where").innerHTML = `${esc(c.group)} / <b>${esc(c.title)}</b>`;
  $("lb-cap").textContent = im.caption;
  const inColl = view.filter(x => x.c === c), k = inColl.findIndex(x => x.i === i);
  $("lb-n").textContent = `${k + 1} / ${inColl.length} in collection · ${pos + 1} / ${view.length} overall`;
  $("lb").hidden = false; document.body.style.overflow = "hidden";
  history.replaceState(null, "", `#${c.id}/${i}`);
  [1, -1].forEach(d => { const n = view[(pos + d + view.length) % view.length]; new Image().src = n.c.images[n.i].src; });
}
function close() {
  $("lb").hidden = true; document.body.style.overflow = ""; $("lb-stage").classList.remove("actual");
  const c = view[pos] && view[pos].c; history.replaceState(null, "", c ? `#${c.id}` : "#");
}
$("lb-prev").onclick = () => open(pos - 1);
$("lb-next").onclick = () => open(pos + 1);
$("lb-close").onclick = close;
$("lb-size").onclick = () => $("lb-stage").classList.toggle("actual");
document.addEventListener("keydown", e => {
  if ($("lb").hidden) return;
  if (e.key === "ArrowRight") open(pos + 1);
  else if (e.key === "ArrowLeft") open(pos - 1);
  else if (e.key === "Escape") close();
  else if (e.key === "z" || e.key === "Z") $("lb-stage").classList.toggle("actual");
});
let tx = null;
$("lb-stage").addEventListener("touchstart", e => { tx = e.touches[0].clientX; }, {passive: true});
$("lb-stage").addEventListener("touchend", e => {
  if (tx === null) return; const dx = e.changedTouches[0].clientX - tx; tx = null;
  if (Math.abs(dx) > 50) open(pos + (dx < 0 ? 1 : -1));
});

render();
const m = location.hash.match(/^#([^/]+)\/(\d+)$/);
if (m && byId[m[1]]) { expanded.add(m[1]); render(); const v = view.findIndex(x => x.c.id === m[1] && x.i === +m[2]); if (v >= 0) open(v); }
else if (byId[location.hash.slice(1)]) document.getElementById(location.hash.slice(1)).scrollIntoView();
</script>
</body>
</html>
